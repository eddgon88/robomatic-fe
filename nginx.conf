user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 1. Redirección HTTP a HTTPS (Puerto 80 -> Puerto 443)
    server {
        listen 80;
        server_name robomatic.cloud www.robomatic.cloud;
        return 301 https://$host$request_uri;
    }

    # 2. Servidor Principal HTTPS Cifrado (Puerto 443)
    server {
        listen 443 ssl;
        server_name robomatic.cloud www.robomatic.cloud;

        ssl_certificate /etc/nginx/certs/robomatic_bundle.crt;
        ssl_certificate_key /etc/nginx/certs/robomatic.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Docker DNS resolver
        resolver 127.0.0.11 valid=30s;

        root /usr/share/nginx/html;
        index index.html;

        # Proxy API requests to the Core service (preserve the /core/ prefix)
        location ^~ /core/ {
            set $upstream_core robomatic-core:8080;
            proxy_pass http://$upstream_core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 90;
            proxy_buffering off;
        }

        # Proxy VNC WebSocket requests
        # Format: /vnc/<port>
        location ~ ^/vnc/([0-9]+)$ {
            # We use local DNS resolution to find the container
            # The container listens on 7900 (official image default for noVNC)
            proxy_pass http://selenium-vnc-$1:7900/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}