<div class="d-flex mb-3 align-items-center">
  <button mat-icon-button (click)="goBack()">
    <i class="bi bi-arrow-left"></i> Back
  </button>
</div>

<mat-tab-group class="evidence-tabs">
  <mat-tab label="Evidence Files">
    <div class="tab-content pt-3">
      <div class="d-flex justify-content-end mb-3">
        <button mat-raised-button color="primary" class="download-all-btn" (click)="downloadAll()" [disabled]="dataSource.data.length === 0">
          <i class="bi bi-download"></i> Descargar Todo
        </button>
      </div>

      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>File Name</th>
          <td mat-cell *matCellDef="let element" (click)="createFolderModal(element)">{{element.file_name}}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="downloadFile(element)" title="Descargar archivo" class="download-btn">
              <i class="bi bi-download"></i>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
      
      <div class="text-center mt-4" *ngIf="inLoad">
        <span class="spinner-border"></span>
      </div>
    </div>
  </mat-tab>

  <mat-tab label="AI Interaction History">
    <div class="tab-content pt-3">
      <div class="alerts-container mb-3" *ngIf="aiInteractions.length === 0 && !inLoad">
        <div class="alert alert-info">
          <i class="bi bi-info-circle me-2"></i>
          No record of AI interactions for this execution.
        </div>
      </div>

      <table mat-table [dataSource]="aiInteractions" class="mat-elevation-z8" *ngIf="aiInteractions.length > 0">
        <!-- Agent Column -->
        <ng-container matColumnDef="agentName">
          <th mat-header-cell *matHeaderCellDef>Agent</th>
          <td mat-cell *matCellDef="let element"><strong>{{element.agentName}}</strong></td>
        </ng-container>

        <!-- Prompt Column -->
        <ng-container matColumnDef="prompt">
          <th mat-header-cell *matHeaderCellDef>Prompt</th>
          <td mat-cell *matCellDef="let element" class="text-truncate" style="max-width: 200px;" [title]="element.prompt">{{element.prompt}}</td>
        </ng-container>

        <!-- Response Column -->
        <ng-container matColumnDef="response">
          <th mat-header-cell *matHeaderCellDef>Response</th>
          <td mat-cell *matCellDef="let element" class="text-truncate" style="max-width: 300px;" [title]="element.response">{{element.response || '-'}}</td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let element">
            <span class="badge" [ngClass]="element.status === 'SUCCESS' ? 'bg-success' : 'bg-danger'">
              {{element.status}}
            </span>
          </td>
        </ng-container>

        <!-- Time Column -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Time</th>
          <td mat-cell *matCellDef="let element">{{element.createdAt | date:'HH:mm:ss'}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedAiColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedAiColumns"></tr>
      </table>
    </div>
  </mat-tab>
</mat-tab-group>
